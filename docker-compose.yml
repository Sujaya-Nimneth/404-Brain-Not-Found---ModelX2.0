services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atie}
      POSTGRES_USER: ${POSTGRES_USER:-atie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atie_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/ingestion_schema.sql:/docker-entrypoint-initdb.d/03-ingestion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atie} -d ${POSTGRES_DB:-atie}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ingestion-worker:
    build:
      context: ./ml-service
    command: ["python", "-m", "etl.ingestion_worker"]
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-atie}:${POSTGRES_PASSWORD:-atie_dev_password}@postgres:5432/${POSTGRES_DB:-atie}
      INGESTION_INTERVAL_SECONDS: ${INGESTION_INTERVAL_SECONDS:-21600}
      HDX_PRICE_URL: ${HDX_PRICE_URL:-https://data.humdata.org/dataset/0298c598-d312-4771-b564-f4ac4d831f05/resource/3638f0d6-9969-48cf-a919-1d879d037ec6/download/wfp_food_prices_lka.csv}
      HDX_CACHE_PATH: /app/data/cache/hdx_wfp_prices.csv
      CROPIX_URL: ${CROPIX_URL:-}
      CROPIX_CACHE_PATH: /app/data/cache/cropix_prices.csv
      OPEN_METEO_URL: https://api.open-meteo.com/v1/forecast
      INGESTION_SCHEMA_PATH: /app/ingestion_schema.sql
    volumes:
      - ./db/ingestion_schema.sql:/app/ingestion_schema.sql:ro
      - ingestion_cache:/app/data/cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_MODEL_PATH: /app/models/atie_forecaster.joblib
      ML_METADATA_PATH: /app/models/evaluation_report.json
      ML_FALLBACK_DATA_PATH: /app/data/fallback_forecasts.json
      ML_MOVEMENT_THRESHOLD_PCT: ${MOVEMENT_THRESHOLD_PCT:-10.0}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atie}
      DATABASE_USERNAME: ${POSTGRES_USER:-atie}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-atie_dev_password}
      ML_SERVICE_URL: http://ml-service:8000
      SAFE_MARGIN_PCT: ${SAFE_MARGIN_PCT:-5.0}
      SAFE_ABSOLUTE_FLOOR_LKR: ${SAFE_ABSOLUTE_FLOOR_LKR:-1000.00}
      MOVEMENT_THRESHOLD_PCT: ${MOVEMENT_THRESHOLD_PCT:-10.0}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173},http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      ingestion-worker:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:8080/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1/healthz",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  postgres_data:
  ingestion_cache:
