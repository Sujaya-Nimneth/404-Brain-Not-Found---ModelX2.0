services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atie}
      POSTGRES_USER: ${POSTGRES_USER:-atie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atie_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atie} -d ${POSTGRES_DB:-atie}"]
      interval: 5s
      timeout: 5s
      retries: 12

  ml-service:
    build:
      context: ./ml-service
    environment:
      ML_MODEL_PATH: /app/models/atie_forecaster.joblib
      ML_METADATA_PATH: /app/models/evaluation_report.json
      ML_FALLBACK_DATA_PATH: /app/data/fallback_forecasts.json
      ML_MOVEMENT_THRESHOLD_PCT: ${MOVEMENT_THRESHOLD_PCT:-10.0}
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
