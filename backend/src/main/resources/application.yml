spring:
  application:
    name: atie-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/atie}
    username: ${DATABASE_USERNAME:atie}
    password: ${DATABASE_PASSWORD:atie_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Colombo

server:
  port: ${BACKEND_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

atie:
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  ml-connect-timeout-seconds: ${ML_CONNECT_TIMEOUT_SECONDS:3}
  ml-read-timeout-seconds: ${ML_READ_TIMEOUT_SECONDS:5}
  safe-margin-pct: ${SAFE_MARGIN_PCT:5.0}
  safe-absolute-floor-lkr: ${SAFE_ABSOLUTE_FLOOR_LKR:1000.00}
  movement-threshold-pct: ${MOVEMENT_THRESHOLD_PCT:10.0}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  api-key: ${ATIE_API_KEY:}
